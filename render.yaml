# Render Blueprint. The free plan has no persistent disk, so data is lost on restart/redeploy.
services:
  - type: web
    name: openenvelope
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: BASE_URL
        sync: false
      - key: IP_SALT
        generateValue: true
      - key: ADMIN_TOKEN
        generateValue: true
      # Invite code your friends type in the extension to create an account on your server.
      - key: SIGNUP_CODE
        sync: false
      # Anyone with the extension can create an account (no invite code). Remove this and set SIGNUP_CODE to require a code.
      - key: ALLOW_SIGNUP
        value: "true"
      - key: DATA_DIR
        value: /data
