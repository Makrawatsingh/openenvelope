# fly launch --copy-config --no-deploy ; fly volumes create data --size 1 ; fly deploy
app = "openenvelope-yourname"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DATA_DIR = "/data"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
